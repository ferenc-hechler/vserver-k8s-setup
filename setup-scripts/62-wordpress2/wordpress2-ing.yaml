apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: wordpress2-ingress
  namespace: wordpress2
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-production  
  labels:
    app: wordpress2
spec:
  ingressClassName: nginx
  tls:
    - secretName: wordpress2-ssl
      hosts:
      - wordpress2.vps-2.calcbox.de          
  rules:
  - host: "wordpress2.vps-2.calcbox.de"
    http:
      paths:
        - pathType: Prefix
          path: "/"
          backend:
            service:
              name: wordpress2
              port:
                number: 80

