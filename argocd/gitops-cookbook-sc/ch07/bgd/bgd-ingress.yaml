apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-production
  name: bgd-ing
  namespace: bgd
spec:
  ingressClassName: nginx
  rules:
  - host: bgd.vps-2.cluster-4.de
    http:
      paths:
      - backend:
          service:
            name: bgd
            port:
              number: 8080
        path: /
        pathType: Prefix
  tls:
  - hosts:
    - bgd.vps-2.cluster-4.de
    secretName: bgd-ssl