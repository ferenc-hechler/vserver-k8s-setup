apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sealed-secrets
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    chart: sealed-secrets
    repoURL: https://bitnami.github.io/sealed-secrets
    # Versionsbereich; für reproduzierbare Deployments auf feste Version pinnen
    targetRevision: 2.*
    helm:
      values: |
        # Name, den kubeseal standardmäßig erwartet
        fullnameOverride: sealed-secrets-controller
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
