apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: wordpress-secret
  namespace: argocd
  annotations:
    # vor der WordPress-Application synchronisieren
    argocd.argoproj.io/sync-wave: "-1"
spec:
  project: default
  source:
    repoURL: https://github.com/ferenc-hechler/vserver-k8s-setup.git
    path: argocd/manifests/wordpress-secret
    targetRevision: vps-2
  destination:
    server: https://kubernetes.default.svc
    namespace: wordpress
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
